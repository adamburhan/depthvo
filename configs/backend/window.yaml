name: window
window: 8            # keyframes kept in the batch solve
old_keyframes: fix   # fix: keyframes that left the window stay as fixed cameras | drop: ignore them
pixel_sigma: 1.0
huber_k: 1.345
lm_max_iters: 20
ransac_px: 1.0       # essential matrix / PnP inlier threshold
max_reproj_px: 2.0   # triangulation acceptance and post-solve landmark cull
min_parallax_deg: 1.0
lost:                # tracking loss: the segment is closed and a new map is initialised
  min_inliers: 15    # PnP inliers below this count as a failed frame
  max_failed_frames: 10   # consecutive failed frames (poses predicted meanwhile) before declaring the loss
  continue_from_last_pose: true   # new segment starts at the extrapolated last pose instead of the origin
init:                # two-view initialisation, retried on each keyframe until it yields a map
  min_landmarks: 50  # triangulated landmarks (passing the gates above) to accept an init pair
  min_shared: 30     # fewer tracks shared with the reference keyframe: the reference moves on
depth:               # per-observation depth constraints from dataset.depth_dir
  enabled: false
  source: metric     # metric: sensor / metric network, makes the map metric
                     # relative: scale-ambiguous network; each keyframe's scale is fitted to the
                     #   triangulated landmarks it sees (map scale stays monocular)
  sigma_rel: 0.05    # relative depth error, 5%
  min_anchors: 20    # relative: landmarks needed to fit a keyframe's scale, else no depth factors for it
  min_m: 0.3         # accept measured depths in [min_m, max_m]
  max_m: 8.0

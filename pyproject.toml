[project]
name = "depthvo"
version = "0.1.0"
description = "Minimal visual odometry: OpenCV frontend, GTSAM sliding-window backend, optional depth constraints"
readme = "README.md"
authors = [{ name = "Adam Burhan", email = "adam.burhan@mila.quebec" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "gtsam>=4.3.0",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pycolmap>=3.11",      # COLMAP-format writer only (feeds 3DGS, viewers)
    "hydra-core>=1.3.2",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "tqdm>=4.66",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6.29"]
viz = ["viser>=1.0", "matplotlib>=3.9"]
